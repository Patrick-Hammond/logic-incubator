name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json

      - run: npm ci

      # The relay is a program of its own (not a workspace), with its own lock; its tests run with the rest.
      - run: npm ci --prefix relay

      - name: Type-check
        run: npx tsc -p . --noEmit

      - name: Tests
        run: npm test

      # Reports problems without failing the run: the code that was here before CI has some old ones (case declarations,
      # prefer-const...) that are a separate clean-up. Drop `continue-on-error` once `npm run lint` is clean.
      - name: Lint
        run: npm run lint
        continue-on-error: true
